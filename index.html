<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LAM TOOL V21</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="timerBox">⏳ --:--</div>

<div id="loginBox">
    <h2>🔐 LOGIN KEY</h2>
    <input id="keyInput" placeholder="Nhập KEY">
    <button onclick="login()">Đăng nhập</button>
</div>

<div id="main" style="display:none;">
    <h1>🎰 LAM TOOL V21</h1>

    <h3>🔐 MD5</h3>
    <input id="md5Input" placeholder="Nhập MD5">
    <button onclick="convertMD5()">Phân tích</button>

    <div class="card">
        <p id="md5Result">---</p>
        <p id="md5Confidence"></p>
    </div>

    <div class="card">
        <h3>AI Predict</h3>
        <p id="predict">---</p>
        <p id="confidence">0%</p>
    </div>

    <div class="card">
        <p id="history"></p>
    </div>

    <button onclick="addResult('T')">Tài</button>
    <button onclick="addResult('X')">Xỉu</button>
</div>

<div id="admin" style="display:none;">
    <h2>ADMIN PANEL</h2>
    <p>⚠️ Bản online: tạo key phải sửa file GitHub</p>
</div>

<script src="app.js"></script>
</body>
</html>
