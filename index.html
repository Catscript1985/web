<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LAM TOOL V22 PRO</title>
<link rel="stylesheet" href="style.css">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>

<div id="timerBox">⏳ --:--</div>

<div id="loginBox">
    <h2>🔐 LOGIN KEY</h2>
    <input id="keyInput" placeholder="Nhập KEY">
    <button onclick="login()">Đăng nhập</button>
</div>

<div id="main" style="display:none;">
    <h1>🎰 LAM TOOL V22</h1>

    <!-- MD5 -->
    <h3>🔐 MD5</h3>
    <input id="md5Input" placeholder="Nhập MD5">
    <button onclick="convertMD5()">Phân tích</button>

    <div class="card">
        <p id="md5Result">---</p>
        <p id="md5Confidence"></p>
    </div>

    <!-- AI -->
    <div class="card">
        <h3>AI Predict</h3>
        <p id="predict">---</p>
        <p id="confidence">0%</p>
    </div>

    <!-- HISTORY -->
    <div class="card">
        <p id="history"></p>
    </div>

    <button onclick="addResult('T')">Tài</button>
    <button onclick="addResult('X')">Xỉu</button>
</div>

<div id="admin" style="display:none;">
    <h2>🛠 ADMIN PANEL</h2>

    <input id="newKey" placeholder="Tạo key">
    <input id="timeKey" placeholder="Phút">
    <button onclick="createKey()">Tạo KEY</button>

    <input id="extendKey" placeholder="Key cần gia hạn">
    <input id="extendTime" placeholder="Phút">
    <button onclick="extendKeyTime()">Gia hạn</button>

    <pre id="keyList"></pre>
</div>

<script src="app.js"></script>
</body>
</html>
